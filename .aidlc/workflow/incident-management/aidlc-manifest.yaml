decisions:
  requirements:
    delivery-boundary: "Web Portal intake + in-app Central Alert Center working; Mail/LINE/Phone/outbound = documented integration boundaries only"
    auth: "Local workshop auth, predefined synthetic users, per-request RBAC, no external IdP"
    sla-defaults: "P1 15m/4h, P2 30m/8h, P3 4h/3bd, P4 8h/5bd (editable config)"
  design:
    repo: "monorepo (npm workspaces): apps/web, apps/api, packages/shared"
    data-layer: "Phase1 frontend mock JSON -> Phase2 Express+PostgreSQL via repository seam"
    db-access: "pg driver + parameterized SQL + custom migration runner"
    auth: "stateless JWT Bearer, RBAC claims"
    ai-adapter: "rules/mock default + optional Bedrock (env-gated)"
    fe-state: "TanStack Query"
    testing: "Vitest + Supertest + React Testing Library"
    correctness: "example-based unit tests for critical rules"
    observability: "Minimal (pino + health)"
    error-tracking: "log-based with errorId"
    lifecycle: "health + readiness + graceful shutdown"
    ui: "clean enterprise console; blue primary + P1-P4/semantic colors; Inter; Lucide"
